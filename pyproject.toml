[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-synthid"
version = "0.1.0"
description = "Multi-tenant SynthID Text watermarking plugin for vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Tyler Michael Smith"}]
dependencies = [
  "transformers>=4.46",
  "vllm>=0.26,<0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vllm-synthid-detect = "vllm_synthid.detect:main"

[tool.setuptools.package-data]
vllm_synthid = ["synthid_config.example.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
