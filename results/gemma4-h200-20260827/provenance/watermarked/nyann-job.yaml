---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nyann-t220400z-gemma4-watermark
data:
  scenario.star: "scenario(\n    stages = [stage(\"1m\", concurrency=1, warmup=True)]\
    \ + [\n        stage(\"2m\", concurrency=1),\n        stage(\"2m\", concurrency=2),\n\
    \        stage(\"2m\", concurrency=4),\n        stage(\"2m\", concurrency=8),\n\
    \        stage(\"2m\", concurrency=16),\n        stage(\"2m\", concurrency=32),\n\
    \        stage(\"2m\", concurrency=64),\n        stage(\"2m\", concurrency=128),\n\
    \        stage(\"2m\", concurrency=256)\n    ],\n    workload = workload(\"corpus\"\
    , corpus_path=\"/datasets/sharegpt-192ab2185289.txt\", isl=8192, osl=1024, turns=1),\n\
    )\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nyann-t220400z-gemma4-watermark
  labels:
    kueue.x-k8s.io/queue-name: synthid-h200
    vr-sweep/run-id: synthid-gemma4-v028-r2-20260827t220400z
    vr-sweep/case-id: gemma4-watermark
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nyann-bench
    spec:
      restartPolicy: Never
      serviceAccountName: vr-sweep
      imagePullSecrets:
      - name: quay-tms
      containers:
      - name: nyann
        image: quay.io/tms/nyann-bench@sha256:bfd64754dc4caadf20f249e218e91eb662249c12ca03c6bae9b51ec686ed1290
        args:
        - generate
        - --target
        - http://gemma4-synthid-vllm:8000/v1
        - --config
        - /config/scenario.star
        - --prometheus-url
        - http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090
        - --deploy-name
        - tms-t220400z-gemma4-watermark-decode
        - --workers
        - '1'
        - --worker-id
        - '0'
        - --output-dir
        - /results/sweeps/synthid-gemma4-v028-r2-20260827t220400z/cases/gemma4-watermark/nyann
        resources:
          requests:
            cpu: '2'
            memory: 2Gi
          limits:
            cpu: '8'
            memory: 8Gi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: results
          mountPath: /results
        - name: datasets
          mountPath: /datasets
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: nyann-t220400z-gemma4-watermark
      - name: results
        persistentVolumeClaim:
          claimName: synthid-bench-results
      - name: datasets
        persistentVolumeClaim:
          claimName: synthid-bench-cache
