apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-forward-bench-d414c0314efc28b6d7754b45
  labels: &id001
    app.kubernetes.io/name: vllm-forward-bench-worker
    app.kubernetes.io/managed-by: vllm-forward-bench
    bench.vllm.ai/job-id: d414c0314efc28b6d7754b45
    bench.vllm.ai/accelerator: h200
    kueue.x-k8s.io/queue-name: synthid-h200
  annotations:
    bench.vllm.ai/accelerator-resource: nvidia.com/gpu
    bench.vllm.ai/worker-plugin-image: quay.io/tms/vllm-forward-bench-plugin@sha256:a825baf134507cf78d05b7b647f6981e3f635b0986cafdd465066d0edce11961
    bench.vllm.ai/worker-bundle-sha256: 82e66ce491d8239469159ce778d75822d8ef429c5160531da47251461c5a0783
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: *id001
      annotations:
        bench.vllm.ai/accelerator-resource: nvidia.com/gpu
        bench.vllm.ai/worker-plugin-image: quay.io/tms/vllm-forward-bench-plugin@sha256:a825baf134507cf78d05b7b647f6981e3f635b0986cafdd465066d0edce11961
        bench.vllm.ai/worker-bundle-sha256: 82e66ce491d8239469159ce778d75822d8ef429c5160531da47251461c5a0783
    spec:
      serviceAccountName: vllm-forward-bench-worker
      restartPolicy: Never
      enableServiceLinks: false
      nodeSelector:
        gpu.nvidia.com/class: H200
      initContainers:
      - name: worker-plugin
        image: quay.io/tms/vllm-forward-bench-plugin@sha256:a825baf134507cf78d05b7b647f6981e3f635b0986cafdd465066d0edce11961
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -ceu
        args:
        - cp /opt/vllm-forward-bench/worker.pyz /worker/worker.pyz; chmod 0444 /worker/worker.pyz
        volumeMounts:
        - name: worker-bundle
          mountPath: /worker
      containers:
      - name: benchmark
        image: quay.io/tms/vllm-synthid@sha256:7cfdbe8550a32173793aa980cda20358403485bbe356d4154e80d514d4c353be
        imagePullPolicy: Always
        args:
        - --spec
        - /config/spec.json
        - --job-id
        - d414c0314efc28b6d7754b45
        - --output-dir
        - /results
        command:
        - python3
        - /worker/worker.pyz
        resources:
          requests:
            cpu: '16'
            memory: 128Gi
            nvidia.com/gpu: '1'
          limits:
            nvidia.com/gpu: '1'
        env:
        - name: LOGNAME
          value: vllm-benchmark
        - name: USER
          value: vllm-benchmark
        - name: HOME
          value: /model-cache
        - name: HF_HOME
          value: /model-cache/huggingface
        - name: XDG_CACHE_HOME
          value: /tmp/xdg-cache
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm-cache
        - name: TRITON_CACHE_DIR
          value: /tmp/triton-cache
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor-cache
        - name: NUMBA_CACHE_DIR
          value: /tmp/numba
        - name: VLLM_ENABLE_V1_MULTIPROCESSING
          value: '0'
        - name: BENCH_WORKER_BUNDLE_PATH
          value: /worker/worker.pyz
        - name: BENCH_WORKER_BUNDLE_SHA256
          value: 82e66ce491d8239469159ce778d75822d8ef429c5160531da47251461c5a0783
        - name: BENCH_WORKER_PLUGIN_IMAGE
          value: quay.io/tms/vllm-forward-bench-plugin@sha256:a825baf134507cf78d05b7b647f6981e3f635b0986cafdd465066d0edce11961
        - name: BENCH_ACCELERATOR_RESOURCE_NAME
          value: nvidia.com/gpu
        - name: BENCH_QUEUE_NAME
          value: synthid-h200
        - name: VLLM_USE_V2_MODEL_RUNNER
          value: '0'
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: worker-bundle
          mountPath: /worker
          readOnly: true
        - name: results
          mountPath: /results
        - name: dshm
          mountPath: /dev/shm
        - name: model-cache
          mountPath: /model-cache
      volumes:
      - name: config
        configMap:
          name: vllm-forward-bench-d414c0314efc28b6d7754b45
      - name: worker-bundle
        emptyDir: {}
      - name: results
        persistentVolumeClaim:
          claimName: vllm-forward-bench-results
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 16Gi
      - name: model-cache
        persistentVolumeClaim:
          claimName: vllm-forward-bench-model-cache
      priorityClassName: cw-hpc-verification
      tolerations:
      - key: qos.coreweave.cloud/interruptable
        operator: Equal
        value: 'true'
        effect: NoExecute
      imagePullSecrets:
      - name: quay-tms
